[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-processor-mvp"
version = "0.1.0"
description = "A small Python and FFmpeg based audio processing CLI."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Local project" }]
dependencies = [
    "setuptools>=69,<81",
    "janome>=0.5,<0.6",
    "pypinyin>=0.51,<1",
    "python-stretch==0.3.1",
    "soundfile>=0.14,<0.15",
]

[project.optional-dependencies]
model-runtime = [
    "torch>=2.5.1,<3.0",
    "torchaudio>=2.5.1,<3.0",
    "openai-whisper",
    "demucs",
    "speechbrain",
    "faster-whisper",
    "whisperx==3.4.5",
    "funasr>=1.3.30,<2.0",
    "modelscope>=1.39.0,<2.0",
    "pyannote.audio==3.4.0",
    "silero-vad",
    "librosa",
    "ctranslate2==4.4.0",
    "transformers==4.57.6",
]
accelerated-asr = [
    "faster-whisper",
]
alignment = [
    "whisperx==3.4.5",
]
diarization = [
    "pyannote.audio==3.4.0",
]
music-structure = [
    "librosa",
]

[project.scripts]
audio-processor = "audio_processor.cli:main"
audio-processor-gui = "audio_processor.gui:main"

[tool.setuptools.packages.find]
include = ["audio_processor*"]
